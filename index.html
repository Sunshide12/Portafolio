<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Redirect</title>
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: left;
            align-items: top;
            background-color: #000000;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .redirect-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.5rem;
            padding: 24px 48px;
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
        }

        .redirect-link:hover {
            transform: translateY(-4px) scale(1.02);
        }
    </style>
</head>

<body>
    <a href="https://portfolio.sunshide.com" class="redirect-link">Portfolio = portfolio.sunshide.com</a>
</body>

</html>
